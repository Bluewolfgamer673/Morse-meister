<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morsecode Meister</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ffb703;
        }
        .container {
            text-align: center;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            width: 90%;
            max-width: 400px;
        }
        button {
            background-color: #ffb703;
            color: #121212;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:active {
            background-color: #fb8500;
        }
        #output {
            font-size: 24px;
            margin-top: 20px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>📻 Morsecode Meister</h1>
        <p>Tippe auf den Button, um Morsezeichen zu senden!</p>
        <button id="morseBtn">Drücken / Morsen</button>
        <div id="output">...</div>
    </div>

    <script>
        const btn = document.getElementById('morseBtn');
        const output = document.getElementById('output');
        let pressTimer;
        let morseSequence = '';

        btn.addEventListener('mousedown', () => {
            pressTimer = Date.now();
        });

        btn.addEventListener('mouseup', () => {
            let duration = Date.now() - pressTimer;
            if (duration < 300) {
                morseSequence += '.';
            } else {
                morseSequence += '-';
            }
            output.textContent = morseSequence;
        });

        // Für Touch-Geräte auf dem Handy
        btn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            pressTimer = Date.now();
        });

        btn.addEventListener('touchend', (e) => {
            e.preventDefault();
            let duration = Date.now() - pressTimer;
            if (duration < 300) {
                morseSequence += '.';
            } else {
                morseSequence += '-';
            }
            output.textContent = morseSequence;
        });
    </script>

</body>
</html>
